<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أعطالي - لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --success: #059669;
      --warning: #d97706;
      --danger: #e11d48;
      --dark: #0f172a;
      --slate: #475569;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--dark); padding-bottom: 50px; }
    .container { width: 100%; max-width: 520px; margin: 0 auto; padding: 12px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
    .input-control { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; outline: none; background: #fff; }
    .btn { width: 100%; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 800; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: var(--slate); }
    .header { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .order-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; display: inline-block; }
  </style>
</head>
<body>

  <!-- شاشة المدير مفعلة مباشرة بدون حجب -->
  <div id="screenAdmin">
    <header class="header">
      <div>
        <h3 style="font-size: 15px; font-weight: 900;">لوحة الإدارة - أعطالي</h3>
        <span id="dateBadge" style="font-size: 10px; color: var(--slate);"></span>
      </div>
      <div style="display: flex; gap: 6px;">
        <button type="button" onclick="resetDatabaseAndFix()" class="btn btn-danger" style="width: auto; padding: 4px 10px; font-size: 11px;">إصلاح السحابة 🔄</button>
      </div>
    </header>

    <div class="container">
      <!-- ملخص سريع -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px;">
        <div class="card" style="text-align: center; margin: 0; padding: 8px;">
          <span style="font-size: 10px; color: var(--slate);">⏳ معلق</span>
          <strong id="statPending" style="font-size: 16px; color: var(--warning); display: block;">0</strong>
        </div>
        <div class="card" style="text-align: center; margin: 0; padding: 8px;">
          <span style="font-size: 10px; color: var(--slate);">✅ منجز</span>
          <strong id="statDone" style="font-size: 16px; color: var(--success); display: block;">0</strong>
        </div>
        <div class="card" style="text-align: center; margin: 0; padding: 8px;">
          <span style="font-size: 10px; color: var(--slate);">💰 بونص</span>
          <strong id="statBonus" style="font-size: 16px; color: var(--primary); display: block;">0 ج</strong>
        </div>
      </div>

      <!-- تسجيل عطل سريع بدون عنوان -->
      <div class="card" style="border: 1.5px solid #93c5fd;">
        <div class="grid-2" style="margin-bottom: 6px;">
          <input type="text" id="custName" placeholder="اسم العميل *" class="input-control">
          <input type="tel" id="custPhone" placeholder="رقم الهاتف *" class="input-control">
        </div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="custDesc" placeholder="المشكلة أو الملاحظة" class="input-control">
          <button type="button" onclick="addNewOrder()" class="btn btn-primary" style="width: auto; padding: 0 14px; white-space: nowrap;">حفظ ➕</button>
        </div>
      </div>

      <!-- أرصدة الفنيين -->
      <div id="techListContainer"></div>

      <!-- قائمة الأعطال -->
      <div class="card">
        <h4 style="font-size: 13px; font-weight: 900; margin-bottom: 8px;">📋 الأعطال الحالية</h4>
        <div id="ordersContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_DB = "https://maintanance-7de19-default-rtdb.firebaseio.com";

    // بيانات مبدئية لا تعتمد على أي مصدر خارجي
    let accounts = [
      { id: 1, role: 'admin', name: 'المدير العام', username: 'admin', pass: '123' },
      { id: 2, role: 'tech', name: 'أحمد سعيد', username: 'ahmed', pass: '111', accumulatedBonus: 0 },
      { id: 3, role: 'tech', name: 'محمود علي', username: 'mahmoud', pass: '222', accumulatedBonus: 0 }
    ];
    let orders = [];
    let bonuses = [];

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function initUI() {
      document.getElementById('dateBadge').innerText = getToday();
      renderAll();
      syncDown();
      setInterval(syncDown, 4000);
    }

    function renderAll() {
      // 1. الإحصائيات
      const pendingCount = orders.filter(o => o.status !== 'done').length;
      const doneCount = orders.filter(o => o.status === 'done').length;
      const totalBonus = bonuses.reduce((sum, b) => sum + (Number(b.amount) || 0), 0);

      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statDone').innerText = doneCount;
      document.getElementById('statBonus').innerText = totalBonus + " ج";

      // 2. الفنيين
      const techBox = document.getElementById('techListContainer');
      techBox.innerHTML = '';
      const techs = accounts.filter(a => a.role === 'tech');

      techs.forEach(t => {
        techBox.innerHTML += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong>${t.name}</strong>
              <span style="display:block; color:var(--success); font-weight:900;">${t.accumulatedBonus || 0} ج</span>
            </div>
            <div style="display:flex; gap:4px;">
              <button onclick="addBonusPrompt('${t.name}')" class="btn btn-success" style="width:auto; padding:4px 8px; font-size:11px;">➕ بونص</button>
              <button onclick="zeroBonus('${t.name}')" class="btn btn-secondary" style="width:auto; padding:4px 8px; font-size:11px;">تصفير</button>
            </div>
          </div>
        `;
      });

      // 3. الأعطال
      const ordBox = document.getElementById('ordersContainer');
      ordBox.innerHTML = '';

      if (orders.length === 0) {
        ordBox.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:12px; padding:8px;">لا توجد أعطال مسجلة</p>';
      } else {
        orders.forEach(o => {
          let techOpts = '<option value="">اختر الفني للإسناد...</option>';
          techs.forEach(t => {
            techOpts += `<option value="${t.name}" ${o.tech === t.name ? 'selected' : ''}>${t.name}</option>`;
          });

          ordBox.innerHTML += `
            <div class="order-box">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${o.customer}</strong>
                <span class="badge" style="background:#e2e8f0;">${o.tech || 'غير مسند'}</span>
              </div>
              <p style="font-size:11px; color:var(--slate); margin:2px 0;">📞 <a href="tel:${o.phone}" style="text-decoration:none; color:var(--primary); font-weight:700;">${o.phone}</a> | ${o.desc || 'عطل ومتابعة'}</p>
              
              <div style="display:flex; gap:4px; margin-top:6px;">
                <select id="sel_${o.id}" class="input-control" style="padding:4px 6px; font-size:11px;">${techOpts}</select>
                <button onclick="assignOrder('${o.id}')" class="btn btn-primary" style="width:auto; padding:4px 10px; font-size:11px; white-space:nowrap;">نقل / إسناد</button>
                <button onclick="deleteOrder('${o.id}')" class="btn btn-danger" style="width:auto; padding:4px 8px; font-size:11px;">✕</button>
              </div>
            </div>
          `;
        });
      }
    }

    function addNewOrder() {
      const c = document.getElementById('custName').value.trim();
      const p = document.getElementById('custPhone').value.trim();
      const d = document.getElementById('custDesc').value.trim();

      if (!c || !p) {
        alert('أدخل اسم العميل ورقم الهاتف');
        return;
      }

      orders.unshift({
        id: 'ORD-' + Date.now().toString().slice(-5),
        customer: c,
        phone: p,
        desc: d || 'صيانة ومتابعة',
        tech: '',
        status: 'pending',
        date: getToday()
      });

      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custDesc').value = '';

      renderAll();
      syncUp();
    }

    function assignOrder(id) {
      const sel = document.getElementById('sel_' + id);
      if (!sel || !sel.value) {
        alert('اختر الفني أولاً');
        return;
      }

      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.tech = sel.value;
        renderAll();
        syncUp();
        alert(`تم إسناد العطل إلى ${sel.value} بنجاح ✓`);
      }
    }

    function deleteOrder(id) {
      if (confirm('حذف هذا العطل؟')) {
        orders = orders.filter(o => o.id !== id);
        renderAll();
        syncUp();
      }
    }

    function addBonusPrompt(techName) {
      const amt = prompt(`أدخل مبلغ البونص لـ (${techName}):`, "50");
      if (amt && Number(amt) > 0) {
        const t = accounts.find(a => a.name === techName);
        if (t) {
          t.accumulatedBonus = (Number(t.accumulatedBonus) || 0) + Number(amt);
          bonuses.unshift({ id: Date.now(), tech: techName, amount: Number(amt), date: getToday() });
          renderAll();
          syncUp();
        }
      }
    }

    function zeroBonus(techName) {
      if (confirm(`تصفير حساب (${techName})؟`)) {
        const t = accounts.find(a => a.name === techName);
        if (t) {
          t.accumulatedBonus = 0;
          renderAll();
          syncUp();
        }
      }
    }

    function syncDown() {
      fetch(`${FIREBASE_DB}/bonus_system_data.json`)
        .then(res => res.json())
        .then(data => {
          if (data) {
            if (Array.isArray(data.accounts) && data.accounts.length > 0) accounts = data.accounts;
            if (Array.isArray(data.orders)) orders = data.orders;
            if (Array.isArray(data.bonusRecords)) bonuses = data.bonusRecords;
            renderAll();
          }
        })
        .catch(() => {});
    }

    function syncUp() {
      fetch(`${FIREBASE_DB}/bonus_system_data.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accounts, orders, bonusRecords: bonuses })
      }).catch(() => {});
    }

    function resetDatabaseAndFix() {
      if (confirm('سيتم إعادة ضبط الحسابات الافتراضية وحفظها في السحابة. متابعة؟')) {
        accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
        renderAll();
        syncUp();
        alert('تمت استعادة الحسابات السليمة ورفعها للسحابة ✓');
      }
    }

    window.onload = initUI;
  </script>
</body>
</html>
